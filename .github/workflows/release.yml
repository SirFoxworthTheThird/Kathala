name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Cutting a release by hand needs a tag push, which is not always available —
  # a sandboxed environment may allow branch pushes and refuse tag refs. Run
  # this from the Actions tab instead and it creates the tag itself, on the
  # commit it builds.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0 (lowercase v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.label }}

    steps:
      # Fail before spending three build matrices on a version that will not
      # trigger anything. `v*.*.*` is matched case-sensitively, so "V1.0.0"
      # pushes a tag and builds nothing — the exact mistake this guards.
      # The input reaches the shell through the environment, never through
      # `${{ }}` inside a run block: Actions substitutes those before bash sees
      # the script, so a version of `v1.0.0"; rm -rf / #` would be pasted in as
      # code rather than read as a string. As a variable it can only ever be a
      # value, however badly formed.
      - name: Check the version is well formed
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Anchored, because it becomes a git tag: anything that is not a
          # version has no business being one. `v*.*.*` is matched
          # case-sensitively by the push trigger, so "V1.0.0" would tag and
          # build nothing — the exact mistake this catches first.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, with a lowercase v. Got '$VERSION'."
            exit 1
          fi
          echo "Releasing $VERSION"

      # A tag push already carries the version in the ref; a manual run carries
      # it in the input. Everything downstream reads this one value rather than
      # branching on the event.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install


      - name: Build and package
        run: npm run electron:make
        env:
          NODE_ENV: production

      # Every made artifact, flattened into one directory. The maker's own tree
      # (`out/make/zip/darwin/arm64/…`, `out/make/squirrel.windows/x64/…`) is an
      # implementation detail of electron-forge, and the release is a flat list
      # of files; flattening here means the release job does not have to know
      # that tree. The names do not collide across platforms.
      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p upload
          find out/make -type f -exec cp {} upload/ \;
          ls -l upload

      - name: Hand them to the release job
        uses: actions/upload-artifact@v4
        with:
          name: made-${{ matrix.label }}
          path: upload/*
          if-no-files-found: error

  # One job creates the release, after all three builds have finished.
  #
  # This was once done by each build job in turn, and both of the ways that
  # went wrong were the same mistake: three jobs racing to manage one release.
  # `action-gh-release` applies `body_path` only to a release it creates
  # itself, so whichever job ran second and third adopted the first job's
  # release and left its own notes unwritten — and when a draft already existed
  # for the tag, all three adopted *that*, publishing new binaries under the
  # previous run's notes. Nothing here can race now: the release is made once,
  # from one commit, with every platform's files already in hand.
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be released
        shell: bash
        run: ls -l artifacts

      # Squirrel builds the Windows installer by embedding the app package into
      # a 223 KB stub, using a 32-bit tool that needs the payload in memory
      # twice. Past about a gigabyte it runs out of address space, writes
      # nothing, and **exits 0** — the maker prints a tick, the build is green,
      # and the installer that ships is the empty stub. v1.1.0 was built,
      # uploaded and nearly published that way; the only outward sign was a
      # 223 KB file where 237 MB was expected.
      #
      # A working installer is the package plus that stub, so the two are within
      # a rounding error of each other. Half is far below anything legitimate
      # and far above a payload-free stub.
      - name: Check the Windows installer carries its payload
        shell: bash
        run: |
          shopt -s nullglob
          setup=(artifacts/*Setup.exe)
          nupkg=(artifacts/*-full.nupkg)
          if [ ${#setup[@]} -eq 0 ] || [ ${#nupkg[@]} -eq 0 ]; then
            echo "::error::No Windows installer or package in artifacts/ — the Windows build did not deliver."
            exit 1
          fi
          setup_size=$(stat -c%s "${setup[0]}")
          nupkg_size=$(stat -c%s "${nupkg[0]}")
          echo "installer $(basename "${setup[0]}"): ${setup_size} bytes"
          echo "package   $(basename "${nupkg[0]}"): ${nupkg_size} bytes"
          if [ "$setup_size" -lt $((nupkg_size / 2)) ]; then
            echo "::error::The installer is ${setup_size} bytes against a ${nupkg_size} byte package — it carries no payload and will not install."
            exit 1
          fi
          echo "The installer carries its payload."

      # The notes for a version live at `docs/release-notes/<version>.md`, so
      # writing them is an ordinary reviewed change rather than something typed
      # into the Releases page once and never seen again. A version without a
      # notes file still releases: the download table below is always appended,
      # and the file is prepended only when it is there.
      #
      # `$VERSION` reaches the shell through the environment rather than through
      # `${{ }}` inside the script, for the reason given above the version check.
      - name: Compose the release body
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          {
            printf '## PlotWeave %s\n\n' "$VERSION"
            if [ -f "$notes" ]; then
              cat "$notes"
              printf '\n---\n\n'
            fi
            cat .github/release-body.md
          } > RELEASE_BODY.md
          if [ -f "$notes" ]; then
            echo "Release notes taken from $notes"
          else
            echo "::warning::No $notes — releasing with the download table only."
          fi

      - name: Create the GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Named explicitly rather than inferred from the ref: on a manual run
          # the ref is a branch, not a tag.
          tag_name: ${{ steps.version.outputs.value }}
          # A draft does not create the git tag; it records where the tag should
          # go when someone publishes it. Left as a branch name — the default is
          # the ref this ran on — that means "wherever main happens to be when
          # the button is pressed", which is not necessarily where it was when
          # these binaries were built. A draft left for a week while main moves
          # on would tag code that was never in the download, and nothing about
          # the tag would show it. Pinned to the commit instead, so the tag can
          # only land on what was built.
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body_path: RELEASE_BODY.md

      # A draft release keeps its tag as ordinary metadata — the git tag itself
      # is only created when the draft is published — and that metadata is easy
      # to lose without noticing. `PATCH /releases/:id` **clears `tag_name` when
      # the field is omitted**, so a request meant only to correct the body
      # silently untags the draft; the release page then still says v1.1.0 in
      # its title while the tag is gone, and publishing it would tag nothing.
      # That happened here, three times in one run.
      #
      # Nothing above sends such a request any more, but the failure was
      # invisible in a green run, so it is checked rather than assumed.
      - name: Check the release is tagged and described
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::The upload step reported no release id."
            exit 1
          fi
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > release.json
          tag=$(jq -r '.tag_name' release.json)
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::Release $RELEASE_ID is tagged '$tag', expected '$VERSION'."
            exit 1
          fi
          # A branch name here rather than a commit would mean the tag lands
          # wherever that branch has got to by the time the draft is published.
          target=$(jq -r '.target_commitish' release.json)
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Release $RELEASE_ID would tag '$target', not the commit built ($GITHUB_SHA)."
            exit 1
          fi
          # The body is what the composed file says, not the previous run's.
          #
          # Compared as shell strings rather than as files, because `$( )`
          # strips trailing newlines from both sides and the two disagree about
          # exactly one: `jq -r` prints a newline after a value that already
          # ends in one. Comparing the files failed on that alone — `130d129`,
          # one empty line — while the notes were identical. Carriage returns
          # go too, so this asks what the notes say rather than how they are
          # encoded; every other difference, including a single changed word,
          # still fails the run.
          got=$(jq -r '.body' release.json | tr -d '\r')
          want=$(tr -d '\r' < RELEASE_BODY.md)
          if [ "$got" != "$want" ]; then
            echo "::error::Release $RELEASE_ID does not carry the notes composed for $VERSION."
            diff <(printf '%s\n' "$got") <(printf '%s\n' "$want") | head -40
            exit 1
          fi
          echo "Release $RELEASE_ID tags $VERSION at $GITHUB_SHA and carries its notes."
