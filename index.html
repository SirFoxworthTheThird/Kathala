<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The SVG is the canonical browser and in-app mark. Raster variants remain
      in `public/` for desktop packaging, operating-system shortcuts, and legacy
      browser support.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlotWeave — a story bible that knows what time it is</title>

    <!--
      What a search result and a shared link look like.

      There was none of this: no description, no preview card. PlotWeave is
      passed around as a URL in writing communities, and every one of those
      links rendered as bare text. The absolute URLs below sit in `content`
      attributes, which no browser fetches — they are read by crawlers, off the
      page — so they do not touch the first-paint rule the `<head>` comment
      below is about. `href`/`src` remain same-origin only, and
      `src/lib/__tests__/indexHtml.test.ts` holds both halves apart.
    -->
    <meta
      name="description"
      content="A local-first story bible for fiction writers. Track where every character is, what they carry and who they know, at any scene in your story. No account, no backend — your work stays on your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlotWeave" />
    <meta property="og:title" content="PlotWeave — a story bible that knows what time it is" />
    <meta
      property="og:description"
      content="Track where every character is, what they carry and who they know, at any scene in your story. Open one of thirty worlds built from published books and scrub through it — no account, nothing to install."
    />
    <meta property="og:url" content="https://plotweave.netlify.app/" />
    <meta property="og:image" content="https://plotweave.netlify.app/og-card.png" />
    <meta property="og:image:alt" content="The PlotWeave dashboard, showing a world's chapters, cast and continuity warnings" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      No external stylesheets, fonts or scripts here, deliberately.

      This used to load Playfair Display from Google Fonts. A `<link
      rel="stylesheet">` is render-blocking, so first paint waited on a
      third-party host for a face the app never asked for: every theme in
      `src/index.css` sets `--font-body` / `--font-heading` to a system stack,
      and "Playfair" appears nowhere else in the source. Measured on the built
      app, same route, differing only in how that one request resolved: 124ms to
      first paint when it was refused outright, ~13s on a network that held the
      connection and then reset it, 25s when the host held for 25s — with
      `performance.getEntriesByType('paint')` still empty five seconds in.
      `electron/main.cjs` loads this same file, so the desktop build waited too.

      `src/lib/__tests__/indexHtml.test.ts` keeps it that way.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
